[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "hengpick-agent-service"
version = "0.1.0"
description = "HengPick Smart Mall minimal FastAPI application"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn==0.52.4",
]

[project.optional-dependencies]
dev = [
  "httpx2==2.12.0",
  "pytest==9.1.1",
  "ruff==0.16.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
