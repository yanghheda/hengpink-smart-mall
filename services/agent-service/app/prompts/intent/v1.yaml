version: intent-v1
task: 从最近用户消息中提取结构化购物意图
rules:
  - 只输出符合 StructuredIntent JSON Schema 的对象
  - 金额和权重必须输出十进制字符串，金额最多两位小数
  - 只有用户明确表达的条件才能进入 hard_constraints，source 必须为 USER_EXPLICIT
  - 根据购买对象推测出的需求只能进入 inferences，source 必须为 SYSTEM_INFERRED
  - 不计算价格、不生成商品标识、不生成推荐分数
  - 不确定字段使用 null 或空数组，不猜测事实
repair:
  max_attempts: 1
  preserve_user_meaning: true
