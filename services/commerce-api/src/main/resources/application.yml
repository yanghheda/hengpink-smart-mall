server:
  port: ${COMMERCE_PORT:8080}

spring:
  application:
    name: commerce-api
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

management:
  health:
    redis:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,agentAvailability

hengpick:
  commerce:
    environment: ${APP_ENV:local}
    agent-url: ${COMMERCE_INTERNAL_AGENT_URL:http://localhost:8000}
    dataset-version: ${COMMERCE_DATASET_VERSION:commerce-demo-2026.08.0}
  identity:
    access-token-ttl: ${AUTH_ACCESS_TOKEN_TTL:PT30M}
    refresh-token-ttl: ${AUTH_REFRESH_TOKEN_TTL:P7D}
    smart-ticket-ttl: ${AUTH_SMART_TICKET_TTL:PT5M}
    h5-access-token-ttl: ${AUTH_H5_ACCESS_TOKEN_TTL:PT30M}
    jwt-secret: ${AUTH_JWT_SECRET:local-demo-signing-key-change-before-production}
