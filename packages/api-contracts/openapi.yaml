openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: HengPick Smart Mall Public API
  version: 0.1.0
  description: >-
    Public contract for health, catalog, and the P05-S01 valid offer slice.
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      summary: Read the public API liveness state
      security: []
      responses:
        "200":
          description: The public API process is live.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "500":
          description: The public API cannot report a valid liveness state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/products:
    get:
      operationId: listProducts
      summary: 分页读取演示商品
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: 商品分页
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductPageResponse"
        "400":
          description: 分页参数非法
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/products/search:
    post:
      operationId: searchProducts
      summary: 结构化搜索与硬条件过滤
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CatalogSearchRequest" }
      responses:
        "200":
          description: 匹配与淘汰 SKU 及稳定原因码
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogSearchResponse" }
        "400":
          description: 类目、预算、属性或操作符非法
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  /api/v1/products/{productId}/facts:
    get:
      operationId: getProductFacts
      summary: 查询 Product 与 SKU 作用域事实
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string }
        - name: skuId
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: 稳定 Fact ID 与确定性事实
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogFactListResponse" }
        "404":
          description: 商品不存在或 SKU 不属于商品
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  /api/v1/products/{productId}:
    get:
      operationId: getProductDetail
      summary: 读取商品及其 SKU 详情
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string }
        - name: skuId
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: 商品详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDetailResponse"
        "404":
          description: 商品不存在或指定 SKU 不属于该商品
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/skus/{skuId}/offers:
    get:
      operationId: listValidOffers
      summary: 按服务端计算时刻查询 SKU 有效报价
      parameters:
        - name: skuId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 半开有效区间内的有效报价
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OfferListResponse" }
components:
  schemas:
    ResponseMeta:
      type: object
      additionalProperties: false
      required:
        - serverTime
      properties:
        serverTime:
          type: string
          format: date-time
    SuccessEnvelope:
      type: object
      additionalProperties: false
      required:
        - requestId
        - data
        - meta
      properties:
        requestId:
          type: string
          description: Request correlation identifier assigned by the server.
        data:
          type: object
          description: Endpoint-specific response payload.
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    ErrorDetail:
      type: object
      additionalProperties: false
      required:
        - field
        - reason
      properties:
        field:
          type: string
        reason:
          type: string
    ApiError:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - retryable
      properties:
        code:
          type: string
        message:
          type: string
          description: User-facing message that does not expose internals.
        retryable:
          type: boolean
        details:
          type: array
          items:
            $ref: "#/components/schemas/ErrorDetail"
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required:
        - requestId
        - error
      properties:
        requestId:
          type: string
        error:
          $ref: "#/components/schemas/ApiError"
    HealthData:
      type: object
      additionalProperties: false
      required:
        - status
        - service
        - contractVersion
      properties:
        status:
          type: string
          enum:
            - UP
        service:
          type: string
        contractVersion:
          type: string
    HealthResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/HealthData"
    ProductSummary:
      type: object
      additionalProperties: false
      required:
        [
          productId,
          categoryId,
          categoryName,
          brand,
          model,
          displayName,
          datasetVersion,
          simulated,
          skuCount,
        ]
      properties:
        productId: { type: string }
        categoryId: { type: string }
        categoryName: { type: string }
        brand: { type: string }
        model: { type: string }
        displayName: { type: string }
        subtitle: { type: string }
        datasetVersion: { type: string }
        simulated: { type: boolean }
        skuCount: { type: integer }
    ProductPage:
      type: object
      additionalProperties: false
      required: [items, page, size, totalElements, totalPages]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ProductSummary" }
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer }
        totalPages: { type: integer }
    ProductPageResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/ProductPage" }
    SkuDetail:
      type: object
      additionalProperties: false
      required:
        [
          skuId,
          skuCode,
          displayName,
          attributes,
          stockStatus,
          stockQuantity,
          warrantyMonths,
        ]
      properties:
        skuId: { type: string }
        skuCode: { type: string }
        displayName: { type: string }
        attributes: { type: object }
        stockStatus: { type: string }
        stockQuantity: { type: integer }
        warrantyMonths: { type: integer }
    ProductDetail:
      type: object
      additionalProperties: false
      required:
        [
          productId,
          categoryId,
          categoryName,
          brand,
          model,
          displayName,
          canonicalSpecs,
          sellingPoints,
          limitations,
          datasetVersion,
          simulated,
          skus,
        ]
      properties:
        productId: { type: string }
        categoryId: { type: string }
        categoryName: { type: string }
        brand: { type: string }
        model: { type: string }
        displayName: { type: string }
        subtitle: { type: string }
        canonicalSpecs: { type: object }
        sellingPoints:
          type: array
          items: { type: string }
        limitations:
          type: array
          items: { type: string }
        warrantySummary: { type: string }
        datasetVersion: { type: string }
        simulated: { type: boolean }
        skus:
          type: array
          items: { $ref: "#/components/schemas/SkuDetail" }
        selectedSku: { $ref: "#/components/schemas/SkuDetail" }
    ProductDetailResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/ProductDetail" }
    AttributeConstraint:
      type: object
      additionalProperties: false
      required: [attribute, operator, value]
      properties:
        attribute: { type: string }
        operator: { type: string, enum: [">=", "<=", "="] }
        value: {}
    CatalogSearchRequest:
      type: object
      additionalProperties: false
      required: [categoryId, inStockOnly, attributes]
      properties:
        categoryId: { type: string }
        minPrice: { type: number }
        maxPrice: { type: number }
        inStockOnly: { type: boolean }
        attributes:
          type: array
          items: { $ref: "#/components/schemas/AttributeConstraint" }
    SearchCandidate:
      type: object
      additionalProperties: false
      required:
        [
          productId,
          skuId,
          displayName,
          categoryId,
          stockStatus,
          stockQuantity,
          attributes,
        ]
      properties:
        productId: { type: string }
        skuId: { type: string }
        displayName: { type: string }
        categoryId: { type: string }
        price: { type: number }
        stockStatus: { type: string }
        stockQuantity: { type: integer }
        attributes: { type: object }
    RejectedCandidate:
      type: object
      additionalProperties: false
      required: [candidate, reasonCodes]
      properties:
        candidate: { $ref: "#/components/schemas/SearchCandidate" }
        reasonCodes:
          type: array
          items: { type: string }
    CatalogSearchResult:
      type: object
      additionalProperties: false
      required: [matched, rejected]
      properties:
        matched:
          type: array
          items: { $ref: "#/components/schemas/SearchCandidate" }
        rejected:
          type: array
          items: { $ref: "#/components/schemas/RejectedCandidate" }
    CatalogSearchResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/CatalogSearchResult" }
    CatalogFact:
      type: object
      additionalProperties: false
      required: [factId, scope, productId, attribute, value, datasetVersion]
      properties:
        factId: { type: string }
        scope: { type: string, enum: [PRODUCT, SKU] }
        productId: { type: string }
        skuId: { type: string }
        attribute: { type: string }
        value: {}
        datasetVersion: { type: string }
    CatalogFactListResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/CatalogFact" }
    OfferView:
      type: object
      additionalProperties: false
      required:
        [
          offerId,
          shopId,
          listPrice,
          salePrice,
          additionalFee,
          currency,
          validFrom,
          validTo,
          datasetVersion,
          version,
        ]
      properties:
        offerId: { type: string }
        shopId: { type: string }
        listPrice: { type: string, pattern: "^[0-9]+\\.[0-9]{2}$" }
        salePrice: { type: string, pattern: "^[0-9]+\\.[0-9]{2}$" }
        additionalFee: { type: string, pattern: "^[0-9]+\\.[0-9]{2}$" }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        validFrom: { type: string, format: date-time }
        validTo: { type: string, format: date-time }
        datasetVersion: { type: string }
        version: { type: integer, minimum: 0 }
    OfferList:
      type: object
      additionalProperties: false
      required: [skuId, calculationAt, offers]
      properties:
        skuId: { type: string }
        calculationAt: { type: string, format: date-time }
        offers:
          type: array
          items: { $ref: "#/components/schemas/OfferView" }
    OfferListResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/OfferList" }
