openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: HengPick Smart Mall Public API
  version: 0.1.0
  description: >-
    Public contract for health, catalog, and the P05-S01 valid offer slice.
paths:
  /api/v1/auth/login:
    post:
      operationId: login
      summary: 使用固定测试账号模拟登录
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: 返回短期 Access Token 与仅本次响应可见的 Refresh Token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthTokenResponse" }
        "400":
          description: 请求参数非法
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "401":
          description: 账号、密码或账号状态不允许登录
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  /api/v1/auth/refresh:
    post:
      operationId: refreshAccessToken
      summary: 旋转 Refresh Token 并签发新的短期 Access Token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "200":
          description: 返回完成 Rotation 的新 Token 对
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthTokenResponse" }
        "400":
          description: 请求参数非法
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "401":
          description: Refresh Token 无效、过期或已经旋转
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  /api/v1/smart-mall/tickets:
    post:
      operationId: createSmartMallTicket
      summary: 创建五分钟有效的一次性 Smart Mall Ticket
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/CreateSmartMallTicketRequest" }
      responses:
        "200":
          description: 明文 Ticket 仅在本次响应返回
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SmartMallTicketResponse" }
        "400":
          description: 请求参数非法
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "401":
          description: RN Access Token 无效或过期
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  /api/v1/smart-mall/sessions/exchange:
    post:
      operationId: exchangeSmartMallTicket
      summary: 原子消费 Ticket 并签发 H5 短期会话
      security: []
      parameters:
        - in: header
          name: Origin
          required: true
          schema: { type: string, format: uri }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/ExchangeSmartMallTicketRequest" }
      responses:
        "200":
          description: 返回 H5 短期会话与最小上下文
          content:
            application/json:
              schema: { $ref: "#/components/schemas/H5SessionResponse" }
        "400":
          description: 请求参数或 Bridge 版本非法
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "401":
          description: Ticket 无效、过期或已兑换
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  /api/v1/decision-sessions/{sessionId}/stream:
    get:
      operationId: streamDecisionEvents
      summary: 续读当前 Decision Run 的阶段事件
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string, minLength: 1, maxLength: 64 }
        - in: header
          name: Last-Event-ID
          required: false
          schema: { type: string, pattern: "^[0-9]+-[0-9]+$" }
      responses:
        "200":
          description: Redis Stream ID 作为 SSE id；无游标时只发送连接后的新事件
          content:
            text/event-stream:
              schema: { type: string }
        "401":
          description: H5 Access Token 无效或过期
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "404":
          description: Session 不存在、无权访问或尚无当前 Run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  /api/v1/decision-sessions/{sessionId}:
    get:
      operationId: getDecisionSession
      summary: 从 MySQL 读取用于刷新恢复和轮询降级的会话快照
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string, minLength: 1, maxLength: 64 }
      responses:
        "200":
          description: 返回当前 Session 与 Run 的权威状态
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/DecisionSessionSnapshotResponse" }
        "401":
          description: H5 Access Token 无效或过期
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "404":
          description: Session 不存在或无权访问
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  /api/v1/health:
    get:
      operationId: getHealth
      summary: Read the public API liveness state
      security: []
      responses:
        "200":
          description: The public API process is live.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "500":
          description: The public API cannot report a valid liveness state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/products:
    get:
      operationId: listProducts
      summary: 分页读取演示商品
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: 商品分页
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductPageResponse"
        "400":
          description: 分页参数非法
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/products/search:
    post:
      operationId: searchProducts
      summary: 结构化搜索与硬条件过滤
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CatalogSearchRequest" }
      responses:
        "200":
          description: 匹配与淘汰 SKU 及稳定原因码
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogSearchResponse" }
        "400":
          description: 类目、预算、属性或操作符非法
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  /api/v1/products/compare:
    post:
      operationId: compareProducts
      summary: 按类目 Schema 对比 2 至 4 个 SKU
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductComparisonRequest" }
      responses:
        "200":
          description: 返回只看差异或全部可比较参数
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductComparisonResponse" }
        "400":
          description: 数量、重复 SKU、模式、类目或 Schema 非法
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "404":
          description: 任一 SKU 不存在
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  /api/v1/products/{productId}/facts:
    get:
      operationId: getProductFacts
      summary: 查询 Product 与 SKU 作用域事实
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string }
        - name: skuId
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: 稳定 Fact ID 与确定性事实
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogFactListResponse" }
        "404":
          description: 商品不存在或 SKU 不属于商品
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  /api/v1/products/{productId}:
    get:
      operationId: getProductDetail
      summary: 读取商品及其 SKU 详情
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string }
        - name: skuId
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: 商品详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDetailResponse"
        "404":
          description: 商品不存在或指定 SKU 不属于该商品
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/skus/{skuId}/offers:
    get:
      operationId: listValidOffers
      summary: 按服务端计算时刻查询 SKU 有效报价
      parameters:
        - name: skuId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 半开有效区间内的有效报价
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OfferListResponse" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    LoginRequest:
      type: object
      additionalProperties: false
      required: [account, password, deviceSessionId]
      properties:
        account: { type: string, minLength: 1, maxLength: 64 }
        password: { type: string, minLength: 1, maxLength: 128 }
        deviceSessionId: { type: string, minLength: 1, maxLength: 128 }
    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken: { type: string, minLength: 1, maxLength: 512 }
    AuthTokens:
      type: object
      additionalProperties: false
      required:
        [
          tokenType,
          accessToken,
          accessTokenExpiresAt,
          refreshToken,
          refreshTokenExpiresAt,
        ]
      properties:
        tokenType: { type: string, enum: [Bearer] }
        accessToken: { type: string }
        accessTokenExpiresAt: { type: string, format: date-time }
        refreshToken: { type: string }
        refreshTokenExpiresAt: { type: string, format: date-time }
    AuthTokenResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/AuthTokens" }
    CreateSmartMallTicketRequest:
      type: object
      additionalProperties: false
      required: [hostType, deviceSessionId, h5Origin]
      properties:
        hostType: { type: string, enum: [REACT_NATIVE] }
        deviceSessionId: { type: string, minLength: 1, maxLength: 128 }
        h5Origin: { type: string, format: uri, pattern: "^https://" }
    SmartMallTicket:
      type: object
      additionalProperties: false
      required: [ticket, expiresAt]
      properties:
        ticket: { type: string, minLength: 43, maxLength: 512 }
        expiresAt: { type: string, format: date-time }
    SmartMallTicketResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/SmartMallTicket" }
    ExchangeSmartMallTicketRequest:
      type: object
      additionalProperties: false
      required: [ticket, hostType, deviceSessionId, bridgeVersion]
      properties:
        ticket: { type: string, minLength: 43, maxLength: 512 }
        hostType: { type: string, enum: [REACT_NATIVE] }
        deviceSessionId: { type: string, minLength: 1, maxLength: 128 }
        bridgeVersion: { type: string, enum: ["1.0"] }
    H5Session:
      type: object
      additionalProperties: false
      required:
        [tokenType, accessToken, accessTokenExpiresAt, userContext, hostContext]
      properties:
        tokenType: { type: string, enum: [Bearer] }
        accessToken: { type: string }
        accessTokenExpiresAt: { type: string, format: date-time }
        userContext:
          type: object
          additionalProperties: false
          required: [userId, role]
          properties:
            userId: { type: string }
            role: { type: string, enum: [DEMO_USER, DEMO_ADMIN] }
        hostContext:
          type: object
          additionalProperties: false
          required: [hostType, deviceSessionId]
          properties:
            hostType: { type: string, enum: [REACT_NATIVE] }
            deviceSessionId: { type: string }
    H5SessionResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/H5Session" }
    ResponseMeta:
      type: object
      additionalProperties: false
      required:
        - serverTime
      properties:
        serverTime:
          type: string
          format: date-time
    SuccessEnvelope:
      type: object
      additionalProperties: false
      required:
        - requestId
        - data
        - meta
      properties:
        requestId:
          type: string
          description: Request correlation identifier assigned by the server.
        data:
          type: object
          description: Endpoint-specific response payload.
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    ErrorDetail:
      type: object
      additionalProperties: false
      required:
        - field
        - reason
      properties:
        field:
          type: string
        reason:
          type: string
    ApiError:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - retryable
      properties:
        code:
          type: string
        message:
          type: string
          description: User-facing message that does not expose internals.
        retryable:
          type: boolean
        details:
          type: array
          items:
            $ref: "#/components/schemas/ErrorDetail"
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required:
        - requestId
        - error
      properties:
        requestId:
          type: string
        error:
          $ref: "#/components/schemas/ApiError"
    DecisionSessionSnapshot:
      type: object
      additionalProperties: false
      required:
        - sessionId
        - currentRunVersion
        - status
      properties:
        sessionId:
          type: string
        currentRunId:
          type: [string, "null"]
        currentRunVersion:
          type: integer
          minimum: 0
        status:
          type: string
          enum:
            [
              DRAFT,
              RUNNING,
              WAITING_CLARIFICATION,
              COMPLETED,
              PARTIAL,
              FAILED,
              SUPERSEDED,
              CANCELLED,
            ]
        currentReportVersion:
          type: [integer, "null"]
          minimum: 1
    DecisionSessionSnapshotResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/DecisionSessionSnapshot"
    HealthData:
      type: object
      additionalProperties: false
      required:
        - status
        - service
        - contractVersion
      properties:
        status:
          type: string
          enum:
            - UP
        service:
          type: string
        contractVersion:
          type: string
    HealthResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/HealthData"
    ProductSummary:
      type: object
      additionalProperties: false
      required:
        [
          productId,
          categoryId,
          categoryName,
          brand,
          model,
          displayName,
          datasetVersion,
          simulated,
          skuCount,
        ]
      properties:
        productId: { type: string }
        categoryId: { type: string }
        categoryName: { type: string }
        brand: { type: string }
        model: { type: string }
        displayName: { type: string }
        subtitle: { type: string }
        datasetVersion: { type: string }
        simulated: { type: boolean }
        skuCount: { type: integer }
    ProductPage:
      type: object
      additionalProperties: false
      required: [items, page, size, totalElements, totalPages]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ProductSummary" }
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer }
        totalPages: { type: integer }
    ProductPageResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/ProductPage" }
    SkuDetail:
      type: object
      additionalProperties: false
      required:
        [
          skuId,
          skuCode,
          displayName,
          attributes,
          stockStatus,
          stockQuantity,
          warrantyMonths,
        ]
      properties:
        skuId: { type: string }
        skuCode: { type: string }
        displayName: { type: string }
        attributes: { type: object }
        stockStatus: { type: string }
        stockQuantity: { type: integer }
        warrantyMonths: { type: integer }
    ProductDetail:
      type: object
      additionalProperties: false
      required:
        [
          productId,
          categoryId,
          categoryName,
          brand,
          model,
          displayName,
          canonicalSpecs,
          sellingPoints,
          limitations,
          datasetVersion,
          simulated,
          skus,
        ]
      properties:
        productId: { type: string }
        categoryId: { type: string }
        categoryName: { type: string }
        brand: { type: string }
        model: { type: string }
        displayName: { type: string }
        subtitle: { type: string }
        canonicalSpecs: { type: object }
        sellingPoints:
          type: array
          items: { type: string }
        limitations:
          type: array
          items: { type: string }
        warrantySummary: { type: string }
        datasetVersion: { type: string }
        simulated: { type: boolean }
        skus:
          type: array
          items: { $ref: "#/components/schemas/SkuDetail" }
        selectedSku: { $ref: "#/components/schemas/SkuDetail" }
    ProductDetailResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/ProductDetail" }
    AttributeConstraint:
      type: object
      additionalProperties: false
      required: [attribute, operator, value]
      properties:
        attribute: { type: string }
        operator: { type: string, enum: [">=", "<=", "="] }
        value: {}
    CatalogSearchRequest:
      type: object
      additionalProperties: false
      required: [categoryId, inStockOnly, attributes]
      properties:
        categoryId: { type: string }
        minPrice: { type: number }
        maxPrice: { type: number }
        inStockOnly: { type: boolean }
        attributes:
          type: array
          items: { $ref: "#/components/schemas/AttributeConstraint" }
    SearchCandidate:
      type: object
      additionalProperties: false
      required:
        [
          productId,
          skuId,
          displayName,
          categoryId,
          stockStatus,
          stockQuantity,
          attributes,
        ]
      properties:
        productId: { type: string }
        skuId: { type: string }
        displayName: { type: string }
        categoryId: { type: string }
        price: { type: number }
        stockStatus: { type: string }
        stockQuantity: { type: integer }
        attributes: { type: object }
    RejectedCandidate:
      type: object
      additionalProperties: false
      required: [candidate, reasonCodes]
      properties:
        candidate: { $ref: "#/components/schemas/SearchCandidate" }
        reasonCodes:
          type: array
          items: { type: string }
    CatalogSearchResult:
      type: object
      additionalProperties: false
      required: [matched, rejected]
      properties:
        matched:
          type: array
          items: { $ref: "#/components/schemas/SearchCandidate" }
        rejected:
          type: array
          items: { $ref: "#/components/schemas/RejectedCandidate" }
    CatalogSearchResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/CatalogSearchResult" }
    ProductComparisonRequest:
      type: object
      additionalProperties: false
      required: [skuIds, mode]
      properties:
        skuIds:
          type: array
          minItems: 2
          maxItems: 4
          uniqueItems: true
          items: { type: string, minLength: 1 }
        mode: { type: string, enum: [DIFFERENCES, ALL] }
        relevantAttributeKeys:
          type: array
          uniqueItems: true
          items: { type: string, minLength: 1 }
    ComparedProduct:
      type: object
      additionalProperties: false
      required: [productId, skuId, displayName]
      properties:
        productId: { type: string }
        skuId: { type: string }
        displayName: { type: string }
    ComparisonRow:
      type: object
      additionalProperties: false
      required: [attributeKey, label, values]
      properties:
        attributeKey: { type: string }
        label: { type: string }
        unit: { type: [string, "null"] }
        values:
          type: array
          items: {}
    ProductComparison:
      type: object
      additionalProperties: false
      required: [categoryId, schemaVersion, mode, products, rows]
      properties:
        categoryId: { type: string }
        schemaVersion: { type: string }
        mode: { type: string, enum: [DIFFERENCES, ALL] }
        products:
          type: array
          minItems: 2
          maxItems: 4
          items: { $ref: "#/components/schemas/ComparedProduct" }
        rows:
          type: array
          items: { $ref: "#/components/schemas/ComparisonRow" }
    ProductComparisonResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/ProductComparison" }
    CatalogFact:
      type: object
      additionalProperties: false
      required: [factId, scope, productId, attribute, value, datasetVersion]
      properties:
        factId: { type: string }
        scope: { type: string, enum: [PRODUCT, SKU] }
        productId: { type: string }
        skuId: { type: string }
        attribute: { type: string }
        value: {}
        datasetVersion: { type: string }
    CatalogFactListResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/CatalogFact" }
    OfferView:
      type: object
      additionalProperties: false
      required:
        [
          offerId,
          shopId,
          listPrice,
          salePrice,
          additionalFee,
          currency,
          validFrom,
          validTo,
          datasetVersion,
          version,
        ]
      properties:
        offerId: { type: string }
        shopId: { type: string }
        listPrice: { type: string, pattern: "^[0-9]+\\.[0-9]{2}$" }
        salePrice: { type: string, pattern: "^[0-9]+\\.[0-9]{2}$" }
        additionalFee: { type: string, pattern: "^[0-9]+\\.[0-9]{2}$" }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        validFrom: { type: string, format: date-time }
        validTo: { type: string, format: date-time }
        datasetVersion: { type: string }
        version: { type: integer, minimum: 0 }
    OfferList:
      type: object
      additionalProperties: false
      required: [skuId, calculationAt, offers]
      properties:
        skuId: { type: string }
        calculationAt: { type: string, format: date-time }
        offers:
          type: array
          items: { $ref: "#/components/schemas/OfferView" }
    OfferListResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/OfferList" }
